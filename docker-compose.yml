version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mongo_jundi_betest
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis_jundi_betest
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_jundi_betest
    restart: unless-stopped
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  http:
    build:
      context: .
      dockerfile: cicd/docker/Dockerfile
    container_name: ms-jundi-betest-http
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
      - kafka
    environment:
      INTERFACE: HTTP
      NODE_ENV: production
      HTTP_PORT: 3000
      BASE_PATH: ''
      CORS: '*'
      MONGODB_URI: mongodb://mongo:27017/db_jundi_betest
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ''
      REDIS_PREFIX: 'redis_jundi_betest:'
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_EXPIRES_IN: 1h
      CACHE_TTL_SECONDS: 300
      KAFKA_ENABLED: 'true'
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ms-jundi-betest
      KAFKA_USER_TOPIC: kafka_jundi_betest
    ports:
      - 3000:3000

volumes:
  mongo_data:
  redis_data:
